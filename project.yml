name: BadmintonCoachApp
options:
  bundleIdPrefix: com.rimemint.badmintoncoach
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
targets:
  BadmintonCoachApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BadmintonCoachApp
    info:
      path: Generated/Info.plist
      properties:
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
        CFBundleDisplayName: バドコーチ
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.rimemint.badmintoncoach.app
        DEVELOPMENT_ASSET_PATHS: ""
    scheme:
      testTargets:
        - BadmintonCoachAppTests
      commandLineArguments: {}
  BadmintonCoachAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/UnitTests
    dependencies:
      - target: BadmintonCoachApp
    settings:
      base:
        SWIFT_VERSION: "5.0"
