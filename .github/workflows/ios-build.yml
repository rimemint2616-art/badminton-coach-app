name: iOS Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    # macos-15 の新しいランナーイメージはiOSシミュレータ・ランタイムが壊れており
    # （Apple純正プロセスすら起動時にdyld/brkクラッシュ）テストを実行できないため、
    # シミュレータが安定している macos-14 を使う。
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          # XcodeGenが生成するプロジェクト(フォーマット77)を開ける Xcode 16 系の
          # うち最新を明示的に選ぶ。macos-14 の既定は Xcode 15.4 で古すぎて開けず、
          # また新しい Xcode 16.x は iOS 18 SDK/シミュレータを備えるため。
          LATEST=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$LATEST" ]; then LATEST=/Applications/Xcode.app; fi
          echo "Using Xcode at $LATEST"
          sudo xcode-select -switch "$LATEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Show XcodeGen version and project.yml (diagnostics)
        run: |
          xcodegen version
          pwd
          ls -la
          cat project.yml

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show available iOS simulators and pick an iPad
        id: sim
        run: |
          xcrun simctl list devices available
          # ランナーのイメージ更新でシミュレータ名/OSが変わっても壊れないよう、
          # 利用可能なiPadシミュレータのUDIDを動的に取得して使う。
          # 既定のXcode(16.x)はiOS 18系まで対応。iOS 26系シミュレータで実行すると
          # CoreSimulatorのデータコンテナ生成が失敗しテストがクラッシュするため、
          # まずiOS 18系のiPadを優先して選ぶ（無ければ任意のiPadにフォールバック）。
          UUID_RE='[0-9A-Fa-f]{8}-([0-9A-Fa-f]{4}-){3}[0-9A-Fa-f]{12}'
          # iOS 18系の中でも最新（末尾）ランタイムのiPadを選ぶ。古いランタイムは
          # ランナーイメージによってはdyld読み込みで壊れていることがあるため。
          IPAD_LINE=$(xcrun simctl list devices available \
            | awk '/^-- iOS / { use = ($0 ~ /iOS 18/) } use && /iPad/ { line=$0 } END { print line }')
          UDID=$(printf '%s' "$IPAD_LINE" | grep -oE "$UUID_RE" | head -1)
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available \
              | grep -i "iPad" | grep -oE "$UUID_RE" | head -1)
          fi
          if [ -z "$UDID" ]; then
            echo "利用可能なiPadシミュレータが見つかりません" >&2
            exit 1
          fi
          echo "Selected iPad simulator UDID: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build for iPad Simulator
        run: |
          xcodebuild build \
            -project BadmintonCoachApp.xcodeproj \
            -scheme BadmintonCoachApp \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Run unit tests on iPad Simulator
        run: |
          xcodebuild test \
            -project BadmintonCoachApp.xcodeproj \
            -scheme BadmintonCoachApp \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Dump crash reports on failure (diagnostics)
        if: failure()
        run: |
          echo "===== Host DiagnosticReports ====="
          ls -la ~/Library/Logs/DiagnosticReports/ 2>/dev/null || true
          for f in ~/Library/Logs/DiagnosticReports/*.ips; do
            [ -e "$f" ] || continue
            echo "----- $f -----"; head -140 "$f"
          done
          echo "===== Simulator DiagnosticReports ====="
          find ~/Library/Developer/CoreSimulator/Devices -name '*.ips' 2>/dev/null | head -10 | while read -r f; do
            echo "----- $f -----"; head -140 "$f"
          done
