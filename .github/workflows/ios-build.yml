name: iOS Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          # ランナーイメージ更新で Xcode_16.app の iOS 18.0 プラットフォームが
          # 未インストールになりビルド不能だったため、ランナー既定（最新の安定版）の
          # Xcode を使う。
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Show XcodeGen version and project.yml (diagnostics)
        run: |
          xcodegen version
          pwd
          ls -la
          cat project.yml

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show available iOS simulators and pick an iPad
        id: sim
        run: |
          xcrun simctl list devices available
          # ランナーのイメージ更新でシミュレータ名/OSが変わっても壊れないよう、
          # 利用可能なiPadシミュレータのUDIDを動的に取得して使う。
          # 既定のXcode(16.x)はiOS 18系まで対応。iOS 26系シミュレータで実行すると
          # CoreSimulatorのデータコンテナ生成が失敗しテストがクラッシュするため、
          # まずiOS 18系のiPadを優先して選ぶ（無ければ任意のiPadにフォールバック）。
          UUID_RE='[0-9A-Fa-f]{8}-([0-9A-Fa-f]{4}-){3}[0-9A-Fa-f]{12}'
          IPAD_LINE=$(xcrun simctl list devices available \
            | awk '/^-- iOS / { use = ($0 ~ /iOS 18/) } use && /iPad/ { print; exit }')
          UDID=$(printf '%s' "$IPAD_LINE" | grep -oE "$UUID_RE" | head -1)
          if [ -z "$UDID" ]; then
            UDID=$(xcrun simctl list devices available \
              | grep -i "iPad" | grep -oE "$UUID_RE" | head -1)
          fi
          if [ -z "$UDID" ]; then
            echo "利用可能なiPadシミュレータが見つかりません" >&2
            exit 1
          fi
          echo "Selected iPad simulator UDID: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build for iPad Simulator
        run: |
          xcodebuild build \
            -project BadmintonCoachApp.xcodeproj \
            -scheme BadmintonCoachApp \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Run unit tests on iPad Simulator
        run: |
          xcodebuild test \
            -project BadmintonCoachApp.xcodeproj \
            -scheme BadmintonCoachApp \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO
